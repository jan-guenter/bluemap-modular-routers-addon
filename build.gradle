// SPDX-License-Identifier: MIT

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'
    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    def modularRoutersJar = providers.gradleProperty('modularRoutersJar')
    if (modularRoutersJar.isPresent()) {
        systemProperty 'modularRoutersJar', modularRoutersJar.get()
    }
}

checkstyle {
    toolVersion = '10.18.2'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.modularrouters',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-modular-routers-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-modular-routers-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-modular-routers-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-modularrouters'
    }
}

tasks.named('sourcesJar', Jar).configure {
    includeEmptyDirs = false
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-modular-routers-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-modular-routers-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-modular-routers-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-modularrouters'
    }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'bluemap.addon.json',
                    'assets/bluemap_modularrouters/blockstates/camouflage.json',
                    'bluemap-modularrouters/profiles/modularrouters/13.2.7/profile.json',
                    'META-INF/LICENSE-bluemap-modular-routers-addon',
                    'META-INF/NOTICE-bluemap-modular-routers-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-modular-routers-addon.md',
                    'META-INF/bluemap-modularrouters/upstreams.json'
            ]
            def missing = required.findAll { !entries.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Production JAR is missing: ${missing}")
            }
            def addon = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('bluemap.addon.json')).getText('UTF-8')
            )
            if (addon.id != addon_id
                    || addon.entrypoint != 'io.github.janguenter.bluemap.modularrouters.BlueMapModularRoutersAddon'
                    || addon.dependencies != []
                    || addon['soft-dependencies'] != []) {
                throw new GradleException('BlueMap add-on metadata mismatch')
            }
            def forbidden = entries.findAll {
                it.endsWith('.jar')
                        || it == 'META-INF/neoforge.mods.toml'
                        || it == 'fabric.mod.json'
                        || it.endsWith('.mixins.json')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('me/desht/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Production JAR contains forbidden entries: ${forbidden}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionJar'), 'verifyPinnedArtifact'
}

tasks.register('verifyPinnedArtifact', Exec) {
    def modularRoutersJar = providers.gradleProperty('modularRoutersJar')
    doFirst {
        if (!modularRoutersJar.isPresent()) {
            throw new GradleException(
                    'Set -PmodularRoutersJar to the exact All the Mons 1.2.0 Modular Routers JAR.'
            )
        }
    }
    commandLine 'python3', 'tools/verify_pinned_artifact.py',
            '--jar', modularRoutersJar.getOrElse('missing')
}

publishing {
    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = addon_name
                description = 'Exact-profile BlueMap rendering for Modular Routers camouflage.'
                url = 'https://github.com/jan-guenter/bluemap-modular-routers-addon'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://spdx.org/licenses/MIT.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/jan-guenter/bluemap-modular-routers-addon'
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-modular-routers-addon.git'
                }
            }
        }
    }
}
