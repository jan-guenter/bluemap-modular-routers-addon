name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable annotated v* tag to release or safely resume
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

concurrency:
  group: release-maven-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable annotated release identity
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "${RELEASE_TAG}" = "v${version}"
          git fetch --force --tags origin
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse 'HEAD^{commit}')" = \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 - "${version}" <<'PY'
          import json
          from pathlib import Path
          import sys

          release = json.loads(Path("provenance/release.json").read_text())
          if release.get("version") != sys.argv[1]:
              raise SystemExit("release provenance version does not match addon_version")
          if release.get("status") != "owner-accepted-release-candidate":
              raise SystemExit("release candidate has not been owner accepted and sealed")
          PY
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 7e07f4e74ec1e92a6ead9aa1e66054af3e133aac
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "7e07f4e74ec1e92a6ead9aa1e66054af3e133aac"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Acquire exact ephemeral Modular Routers inputs
        run: |
          input_dir="${RUNNER_TEMP}/modular-routers-input"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/modular-routers-13.2.7+mc1.21.1.jar" \
            "https://www.curseforge.com/api/v1/mods/250294/files/8478801/download"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/bluemap-glassential-addon-0.1.0-alpha.2.jar" \
            "https://github.com/jan-guenter/bluemap-glassential-addon/releases/download/v0.1.0-alpha.2/bluemap-glassential-addon-0.1.0-alpha.2.jar"
          test "$(stat -c %s \
            "${input_dir}/modular-routers-13.2.7+mc1.21.1.jar")" -eq 1285765
          test "$(stat -c %s \
            "${input_dir}/bluemap-glassential-addon-0.1.0-alpha.2.jar")" \
            -eq 166871
          sha256sum --check <<SHA256SUMS
          10f84e7f2d1bc7b655d8398d8c2e7146c4929c3ad2c97408f940ca86c1bf898c  ${input_dir}/modular-routers-13.2.7+mc1.21.1.jar
          9df99ffba26b1dd5a38452fb020e9a931b6a16a4ab4c374d85dad91cb9437e60  ${input_dir}/bluemap-glassential-addon-0.1.0-alpha.2.jar
          SHA256SUMS
          python3 tools/verify_pinned_artifact.py \
            --jar "${input_dir}/modular-routers-13.2.7+mc1.21.1.jar" \
            --glassential-addon \
              "${input_dir}/bluemap-glassential-addon-0.1.0-alpha.2.jar"

      - name: Verify gallery and provenance inputs
        run: |
          python3 -m json.tool provenance/upstreams.json >/dev/null
          python3 -m json.tool provenance/release.json >/dev/null
          python3 gallery/generate.py --check
          python3 gallery/lint.py
          (cd gallery && sha256sum --check SHA256SUMS)
          bash gallery/package.sh "${RUNNER_TEMP}/gallery-first.zip"
          bash gallery/package.sh "${RUNNER_TEMP}/gallery-second.zip"
          cmp "${RUNNER_TEMP}/gallery-first.zip" \
            "${RUNNER_TEMP}/gallery-second.zip"
          test "$(stat -c %s "${RUNNER_TEMP}/gallery-first.zip")" -eq 3825
          sha256sum --check <<SHA256SUMS
          f6011f220590f8ddb6d557e9be01830e3872e3c0ec17cfb8fd3c9816a9b9cd6f  ${RUNNER_TEMP}/gallery-first.zip
          SHA256SUMS

      - name: Build and verify accepted bytes
        run: |
          input_dir="${RUNNER_TEMP}/modular-routers-input"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PmodularRoutersJar="${input_dir}/modular-routers-13.2.7+mc1.21.1.jar" \
            -PglassentialAddonJar="${input_dir}/bluemap-glassential-addon-0.1.0-alpha.2.jar" \
            "-PreleaseTag=${RELEASE_TAG}" \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication \
            verifyPublicationArtifacts verifyReleaseCandidate
          test "$(stat -c %s \
            "build/libs/bluemap-modular-routers-addon-${VERSION}.jar")" \
            -eq 53593
          test "$(stat -c %s \
            "build/libs/bluemap-modular-routers-addon-${VERSION}-sources.jar")" \
            -eq 30100
          test "$(stat -c %s build/publications/addon/pom-default.xml)" -eq 1376
          test "$(stat -c %s build/publications/addon/module.json)" -eq 2873
          sha256sum --check <<SHA256SUMS
          160a3fc276057e634b5c1c2dad7641028c7be811a5a7262d6da53c3936b8dfc2  build/libs/bluemap-modular-routers-addon-${VERSION}.jar
          4f0775396de8c9efaad67ccc92842cb304d03f6fde51875afb2bc5576dd7bd42  build/libs/bluemap-modular-routers-addon-${VERSION}-sources.jar
          83bd1e0332250735d4d7dacf16f960027355a77e7e376649d4add4d611e68807  build/publications/addon/pom-default.xml
          a235e86a49c5889fa2c406f3fd330200f5d38a0ffead25356cba84318cd887bc  build/publications/addon/module.json
          SHA256SUMS

      - name: Prepare deterministic release bundle
        run: |
          mkdir release
          cp "build/libs/bluemap-modular-routers-addon-${VERSION}.jar" release/
          cp "build/libs/bluemap-modular-routers-addon-${VERSION}-sources.jar" \
            release/
          cp build/publications/addon/pom-default.xml \
            "release/bluemap-modular-routers-addon-${VERSION}.pom"
          cp build/publications/addon/module.json \
            "release/bluemap-modular-routers-addon-${VERSION}.module.json"
          (
            cd release
            sha256sum -- \
              "./bluemap-modular-routers-addon-${VERSION}-sources.jar" \
              "./bluemap-modular-routers-addon-${VERSION}.jar" \
              "./bluemap-modular-routers-addon-${VERSION}.module.json" \
              "./bluemap-modular-routers-addon-${VERSION}.pom" \
              > SHA256SUMS
          )
          (cd release && sha256sum --check SHA256SUMS)
          test "$(stat -c %s release/SHA256SUMS)" -eq 480
          test "$(sha256sum release/SHA256SUMS | cut -d ' ' -f 1)" = \
            3f52c24bbbf2a37b2af56f73d2faf40294956cff08c2765e1316000c89ac3c8e

      - name: Create or refresh draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" \
              --json isDraft --jq '.isDraft')" = true
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --draft \
              --prerelease \
              --generate-notes \
              --title "BlueMap Modular Routers Add-on ${VERSION}" \
              --verify-tag
          fi

      - name: Attest release assets with Sigstore
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Publish Maven package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PmodularRoutersJar="${RUNNER_TEMP}/modular-routers-input/modular-routers-13.2.7+mc1.21.1.jar" \
            -PglassentialAddonJar="${RUNNER_TEMP}/modular-routers-input/bluemap-glassential-addon-0.1.0-alpha.2.jar" \
            publishAddonPublicationToGitHubPackagesRepository

      - name: Verify draft assets and publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          downloaded="${RUNNER_TEMP}/release-assets"
          mkdir -p "${downloaded}"
          gh release download "${RELEASE_TAG}" --dir "${downloaded}"
          for asset in release/*; do
            cmp "${asset}" "${downloaded}/$(basename "${asset}")"
          done
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
